# ---------------------------------------------------------------------------
# NanoArray - build configuration
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Mod coordinates
nanoarray.group=dev.nanomango
nanoarray.artifact=nanoarray
nanoarray.version=1.0.0

# ---------------------------------------------------------------------------
# Toolchain
# ---------------------------------------------------------------------------
# 1.21.x targets Java 21, 26.x targets Java 25. The shared `common` module is
# compiled with --release 21 so that it can be consumed by every version.
nanoarray.common.java.release=21

# ---------------------------------------------------------------------------
# Minecraft versions
#
# minecraft.version    the Minecraft release
# minecraft.java       java release required by that Minecraft version
# minecraft.lwjgl      the LWJGL version that Minecraft ships (native libraries
#                      must match exactly, so NanoArray's optional LWJGL based
#                      NanoVG backend is pinned per version)
# minecraft.fabricApi  Fabric API build for that Minecraft version
# ---------------------------------------------------------------------------
minecraft.1_21_11.version=1.21.11
minecraft.1_21_11.java=21
minecraft.1_21_11.lwjgl=3.3.3
minecraft.1_21_11.fabricApi=0.141.6+1.21.11
minecraft.1_21_11.loomPlugin=net.fabricmc.fabric-loom-remap

minecraft.26_1_2.version=26.1.2
minecraft.26_1_2.java=25
minecraft.26_1_2.lwjgl=3.4.1
minecraft.26_1_2.fabricApi=0.155.3+26.1.2
minecraft.26_1_2.loomPlugin=net.fabricmc.fabric-loom

minecraft.26_2.version=26.2
minecraft.26_2.java=25
minecraft.26_2.lwjgl=3.4.1
minecraft.26_2.fabricApi=0.161.0+26.2
minecraft.26_2.loomPlugin=net.fabricmc.fabric-loom

minecraft.26_3.version=26.3
minecraft.26_3.java=25
minecraft.26_3.lwjgl=3.4.3
minecraft.26_3.fabricApi=0.166.2+26.3
minecraft.26_3.loomPlugin=net.fabricmc.fabric-loom

# Fabric Loader (identical for every supported Minecraft version)
loader.version=0.20.1

# Fabric Loom
loom.version=1.19-SNAPSHOT
