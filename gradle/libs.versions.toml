gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
lwjgl-nanovg = { module = "org.lwjgl:lwjgl-nanovg", version = "3.4.3" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version = "1.19-SNAPSHOT" }
