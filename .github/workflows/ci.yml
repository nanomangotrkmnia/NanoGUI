name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Build and test (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify the prebuilt native libraries are present
        run: ./gradlew checkNative --console=plain

      - name: Run the framework tests
        run: ./gradlew :common:test --console=plain

      - name: Run the per-version test tasks
        run: ./gradlew testAll --console=plain

      - name: Build every Minecraft version
        run: ./gradlew buildAll --console=plain

      - name: Upload the mod jars
        uses: actions/upload-artifact@v4
        with:
          name: nanogui-jars
          path: versions/*/build/libs/*.jar
          if-no-files-found: error

  native:
    name: Build and test (native font renderer)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu,aarch64-pc-windows-msvc,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install Zig and cargo-xwin
        run: |
          brew install zig
          cargo install cargo-zigbuild --locked
          cargo install cargo-xwin --locked

      - name: Run the Rust unit tests
        working-directory: native/font-renderer
        run: cargo test --release

      - name: Cross compile every platform
        run: ./gradlew buildNative --console=plain

      - name: Verify that every binary exists
        run: ./gradlew checkNative --console=plain

      - name: Upload the native libraries
        uses: actions/upload-artifact@v4
        with:
          name: nanogui-native
          path: native/font-renderer/dist/**/*
          if-no-files-found: error
